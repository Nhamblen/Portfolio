<!DOCTYPE html>
<html lang="en">


<!-- Meta tags, page title, and link to css/js -->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description"
    content="Med Assist provides efficient and reliable IT help desk solutions tailored for the healthcare industry. From technical troubleshooting to system management, our team ensures seamless operations for healthcare providers and professionals.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Med Assist</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/main.js" defer></script>
</head>

<body>
  <!-- Includes title and nav -->
  <header>
    <h1>Med Assist</h1>
    <nav>
      <ul class="nav_top">
        <li><a href="."><img src="img/home.png" alt="home icon"></a></li>
        <li><a href="pages/tickets"><img src="img/my_ticket.png" alt="my tickets icon"></a></li>
        <li><a href="pages/new_ticket"><img src="img/create_ticket.png" alt="create ticket icon"></a></li>
      </ul>
      <ul class="nav_bottom">
        <li><a href="#"><img src="img/logout.png" alt="logout icon"></a></li>
      </ul>
    </nav>
  </header>


  <div id="content_container">

    <!-- Main content of the page -->
    <main>
      <!-- Create Ticket Form -->
      <section id="create_ticket">
        <h2>Create a Support Ticket</h2>
        <form id="ticket_form">
          <label for="subject">Subject:</label>
          <input type="text" id="subject" name="subject" required>

          <label for="description">Description:</label>
          <textarea id="description" name="description" rows="4" required></textarea>

          <button type="submit">Submit Ticket</button>
        </form>
      </section>

      <!-- Ticket List -->
      <section id="ticket_dashboard">
        <h2>My Tickets</h2>
        <div id="ticket_list">
          <!-- Tickets will be dynamically added here via JS -->
        </div>
      </section>

    </main>

    <!-- Footer -->
    <footer>
      <p>&copy; 2025 Med Assist. All rights reserved.</p>
    </footer>

  </div>

</body>

</html>
